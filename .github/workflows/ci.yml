name: CI

# La CI tourne sur push et PR vers main et develop : les checks `test` et `e2e-a11y` sont requis par la
# protection de branche (voir CONTRIBUTING.md), ils doivent donc exister sur toute PR qui cible une branche protégée.
# workflow_call : release.yml rejoue exactement ces jobs avant de construire le .vsix.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

# Les jobs lisent le code et téléversent un artefact : aucun droit d'écriture sur le dépôt n'est nécessaire.
permissions:
  contents: read

# Les poussées successives sur une PR n'empilent pas de runs ; les push sur main/develop et les appels de release.yml ne sont jamais annulés.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # !cancelled() : un échec n'en masque plus un autre (typecheck, lint a11y, axe...)
      - name: Release consistency (extension/app versions, CHANGELOG)
        run: node scripts/release-check.js

      - name: Root tests (scripts, app)
        if: ${{ !cancelled() }}
        run: pnpm test

      - name: Extension tests
        if: ${{ !cancelled() }}
        run: pnpm --dir extension test

      - name: Extension typecheck
        if: ${{ !cancelled() }}
        run: pnpm --filter agent-lens run lint

      - name: Extension tests typecheck
        if: ${{ !cancelled() }}
        run: pnpm --filter agent-lens run lint:test

      - name: Scripts typecheck (scripts/*.ts and *.test.ts)
        if: ${{ !cancelled() }}
        run: pnpm run lint:scripts

      - name: Web typecheck
        if: ${{ !cancelled() }}
        run: pnpm --dir web exec tsc --noEmit

      - name: Web accessibility lint (jsx-a11y)
        if: ${{ !cancelled() }}
        run: pnpm --dir web run lint:a11y

      - name: Web accessibility tests (axe-core, keyboard)
        if: ${{ !cancelled() }}
        run: pnpm run test:a11y

  e2e-a11y-shard:
    # Layout-dependent checks jsdom cannot do: axe on the real page (including color
    # contrast), 320 px / 200 % reflow, prefers-reduced-motion and the full-page Tab order.
    # The e2e files are split into shards balanced by measured duration (web/tests-a11y/e2e/shard-weights.json,
    # #611); each shard runs its files one at a time, so one demo server at a time, like test:e2e.
    name: e2e-a11y (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # A failing shard lets the others finish: every failure of the run stays visible.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium build, keyed on the lockfile (it pins the Playwright version). The system packages still come
      # from --with-deps on every run. Only shard 1 saves, so the shards never race for one key.
      - name: Restore Playwright browser
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium for Playwright
        id: playwright-install
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: Save Playwright browser
        if: ${{ matrix.shard == 1 && steps.playwright-install.outcome == 'success' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      # Turbopack's dev cache of the demo server (NEXT_DIST_DIR=.next-e2e): without it the first file of each
      # shard compiles the app from scratch. Turbopack checks its inputs itself, so an older cache (restore-keys)
      # can only be slower, not wrong. Only shard 1 saves, once per lockfile + sources the app compiles (the key
      # lists them; web/node_modules and the build output stay out of the hash).
      - name: Restore Next dev cache
        id: next-cache
        uses: actions/cache/restore@v4
        with:
          path: web/.next-e2e/dev/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('web/app/**', 'web/components/**', 'web/lib/**', 'web/hooks/**', 'web/public/**', 'web/*.json', 'web/*.mjs') }}
          restore-keys: |
            next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-e2e-${{ runner.os }}-

      # Each test file starts the demo app itself on a free port and stops it at the end. The runner prints the
      # files of the shard first, and its totals (tests, pass, fail...) at the end and in the job summary.
      - name: Browser accessibility tests (Playwright + axe-core)
        env:
          E2E_SHARD: ${{ matrix.shard }}/4
        run: pnpm --dir web run test:e2e:shard

      - name: Save Next dev cache
        if: ${{ !cancelled() && matrix.shard == 1 && steps.next-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: web/.next-e2e/dev/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}

      # One log per e2e file (web/test-results/demo-server-<file>.log): pid, attempt, port, time, identity of
      # the process listening on the port, then the server output. Read it first on a "connection refused" (#575).
      # One artifact per shard (#581), with the shard's TAP report (e2e-shard-<n>.tap).
      - name: Demo server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-demo-server-log-shard-${{ matrix.shard }}
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-a11y:
    # The check branch protection requires (contexts[]=e2e-a11y). It runs even when a shard failed, was cancelled
    # or never started (always()), and fails unless every shard succeeded: a skipped required check would pass.
    needs: e2e-a11y-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every e2e shard succeeded
        env:
          SHARDS_RESULT: ${{ needs.e2e-a11y-shard.result }}
        run: |
          echo "e2e-a11y-shard: $SHARDS_RESULT (a failing shard is the red job 'e2e-a11y (shard n/4)' of this run)"
          test "$SHARDS_RESULT" = success
