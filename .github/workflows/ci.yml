name: CI

# La CI tourne sur push et PR vers main et develop : les checks `test` et `e2e-a11y` sont requis par la
# protection de branche (voir CONTRIBUTING.md), ils doivent donc exister sur toute PR qui cible une branche protégée.
# workflow_call : release.yml rejoue exactement ces jobs avant de construire le .vsix.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

# Les jobs lisent le code et téléversent un artefact : aucun droit d'écriture sur le dépôt n'est nécessaire.
permissions:
  contents: read

# Les poussées successives sur une PR n'empilent pas de runs ; les push sur main/develop et les appels de release.yml ne sont jamais annulés.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # !cancelled() : un échec n'en masque plus un autre (typecheck, lint a11y, axe...)
      - name: Release consistency (extension/app versions, CHANGELOG)
        run: node scripts/release-check.js

      - name: Root tests (scripts, app)
        if: ${{ !cancelled() }}
        run: pnpm test

      - name: Extension tests
        if: ${{ !cancelled() }}
        run: pnpm --dir extension test

      - name: Extension typecheck
        if: ${{ !cancelled() }}
        run: pnpm --filter agent-lens run lint

      - name: Extension tests typecheck
        if: ${{ !cancelled() }}
        run: pnpm --filter agent-lens run lint:test

      - name: Scripts typecheck (scripts/*.ts and *.test.ts)
        if: ${{ !cancelled() }}
        run: pnpm run lint:scripts

      - name: Web typecheck
        if: ${{ !cancelled() }}
        run: pnpm --dir web exec tsc --noEmit

      - name: Web accessibility lint (jsx-a11y)
        if: ${{ !cancelled() }}
        run: pnpm --dir web run lint:a11y

      - name: Web accessibility tests (axe-core, keyboard)
        if: ${{ !cancelled() }}
        run: pnpm run test:a11y

      # Module Go du protocole du binaire de menu (#510) : bibliothèque standard seulement, aucune interface
      # graphique. go test inclut le bout en bout avec le vrai pilote Node (d'où l'ordre : après pnpm install).
      - uses: actions/setup-go@v5
        if: ${{ !cancelled() }}
        with:
          go-version-file: app-tray/native/go.mod
          cache: false

      - name: Tray protocol module format (gofmt)
        if: ${{ !cancelled() }}
        working-directory: app-tray/native
        run: test -z "$(gofmt -l .)"

      - name: Tray protocol module vet
        if: ${{ !cancelled() }}
        working-directory: app-tray/native
        run: go vet ./...

      - name: Tray protocol module tests (Go, no GUI)
        if: ${{ !cancelled() }}
        working-directory: app-tray/native
        run: go test ./...

      # Compilation croisée (#511) : le module compile et passe go vet pour les trois bureaux, en Go pur. Pas de
      # package main encore (le binaire avec interface n'existe pas) : aucun binaire écrit ni publié (#512).
      - name: Tray protocol module cross-build (linux/amd64, darwin/arm64, windows/amd64)
        if: ${{ !cancelled() }}
        working-directory: app-tray/native
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          for target in linux/amd64 darwin/arm64 windows/amd64; do
            echo "== $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./...
            GOOS="${target%/*}" GOARCH="${target#*/}" go vet ./...
          done

  e2e-a11y-shard:
    # Layout-dependent checks jsdom cannot do: axe on the real page (including color
    # contrast), 320 px / 200 % reflow, prefers-reduced-motion and the full-page Tab order.
    # The e2e files are split into shards balanced by measured duration (web/tests-a11y/e2e/shard-weights.json,
    # #611); each shard runs its files one at a time, so one demo server at a time, like test:e2e.
    name: e2e-a11y (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # A failing shard lets the others finish: every failure of the run stays visible.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium build, keyed on the lockfile (it pins the Playwright version). The system packages come
      # from the install step below, only when needed. Only shard 1 saves, so the shards never race for one key.
      - name: Restore Playwright browser
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # The apt packages are NOT downloaded on every run any more (#440): `--with-deps` fetched ~25 MB each time,
      # even on a cache hit, and a slow mirror (24-64 kB/s on 2026-10-23) ate the 15 min of the job. The browser
      # alone is installed (a no-op on a cache hit), then ldd on its binaries decides whether a system library is
      # really missing; only then `install-deps` runs. ldd only checks the linked libraries: it cannot see the
      # fonts (fonts-freefont-ttf, fonts-ipafont-gothic, fonts-tlwg-loma-otf, fonts-unifont, fonts-wqy-zenhei,
      # xfonts-*) nor xvfb that `--with-deps` also installed, and those are no longer installed. No e2e file compares a
      # reference capture or types CJK, Thai or Cyrillic text (git grep of web/tests-a11y/e2e on 2026-10-24), but a
      # missing font could still change a text width: that effect is not proven either way.
      # The step has its own budget (the limits below add up to less than its timeout-minutes) and exactly one new
      # attempt, and it logs what it did, so a slow mirror reads as an install failure, not as cancelled tests.
      - name: Install Chromium for Playwright
        id: playwright-install
        timeout-minutes: 4
        run: |
          set -uo pipefail
          SECONDS=0
          echo "cache-hit=${{ steps.playwright-cache.outputs.cache-hit }}"
          installed=false
          for attempt in 1 2; do
            echo "attempt $attempt/2: playwright install chromium (limit 60 s, t=${SECONDS}s)"
            if timeout 60 pnpm --dir web exec playwright install chromium; then
              installed=true
              break
            fi
            echo "::warning::attempt $attempt/2 of 'playwright install chromium' failed or timed out after ${SECONDS}s"
          done
          if [ "$installed" != true ]; then
            echo "::error::Chromium install failed after 2 attempts (${SECONDS}s): download problem, no test was run"
            exit 1
          fi
          missing=0
          ldd_failed=0
          checked=0
          while IFS= read -r bin; do
            checked=$((checked + 1))
            if ! ldd_out=$(ldd "$bin" 2>&1); then
              # not a dynamic executable or unreadable: nothing was verified, so do not report "no missing library"
              echo "ldd failed for $bin (nothing verified): $ldd_out"
              ldd_failed=1
            elif out=$(printf '%s\n' "$ldd_out" | grep 'not found'); then
              echo "missing libraries for $bin:"
              echo "$out"
              missing=1
            else
              echo "no missing library for $bin"
            fi
          done < <(find ~/.cache/ms-playwright -type f \( -name chrome-headless-shell -o -name headless_shell -o -name chrome \))
          if [ "$checked" = 0 ]; then
            echo "::error::no Chromium binary found under ~/.cache/ms-playwright after the install"
            exit 1
          fi
          if [ "$missing" = 1 ] || [ "$ldd_failed" = 1 ]; then
            echo "decision: missing libraries or ldd failed, running 'playwright install-deps chromium' (apt)"
            timeout 90 pnpm --dir web exec playwright install-deps chromium || { echo "::error::install-deps failed or timed out after ${SECONDS}s"; exit 1; }
          else
            echo "decision: no missing library among the linked libraries, apt skipped (fonts and xvfb are not checked)"
          fi
          echo "Install step duration: ${SECONDS}s"

      - name: Save Playwright browser
        if: ${{ matrix.shard == 1 && steps.playwright-install.outcome == 'success' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      # No cache of the Turbopack dev cache (web/.next-e2e/dev/cache): tried in #611, it saved at most ~5 s per
      # shard (within noise) for ~85 MB of cache per source state.

      # Each test file starts the demo app itself on a free port and stops it at the end. The runner prints the
      # files of the shard first, and its totals (tests, pass, fail...) at the end and in the job summary.
      - name: Browser accessibility tests (Playwright + axe-core)
        # Own budget (#440): install (4) + tests (10) stay under the 15 min of the job, with room for the setup.
        # The slowest shard took about 8 min of tests on 2026-10-23.
        timeout-minutes: 10
        env:
          E2E_SHARD: ${{ matrix.shard }}/4
        run: pnpm --dir web run test:e2e:shard

      # One log per e2e file (web/test-results/demo-server-<file>.log): pid, attempt, port, time, identity of
      # the process listening on the port, then the server output. Read it first on a "connection refused" (#575).
      # One artifact per shard (#581), with the shard's TAP report (e2e-shard-<n>.tap).
      - name: Demo server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-demo-server-log-shard-${{ matrix.shard }}
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-a11y:
    # The check branch protection requires (contexts[]=e2e-a11y). It runs even when a shard failed, was cancelled
    # or never started (always()), and fails unless every shard succeeded: a skipped required check would pass.
    needs: e2e-a11y-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every e2e shard succeeded
        env:
          SHARDS_RESULT: ${{ needs.e2e-a11y-shard.result }}
        run: |
          echo "e2e-a11y-shard: $SHARDS_RESULT (a failing shard is the red job 'e2e-a11y (shard n/4)' of this run)"
          test "$SHARDS_RESULT" = success
