name: Fermer les tickets liés

# GitHub ne ferme automatiquement les tickets (« Closes #n ») que lorsqu'une PR
# est fusionnée dans la branche par défaut (main). Ici le travail courant est
# fusionné dans develop : ce workflow reproduit le comportement natif pour develop.

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  issues: write
  pull-requests: read

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            // Mots-clés natifs de GitHub ; « Refs #n » ne ferme volontairement rien.
            // La description est lue comme donnée, jamais interpolée dans un shell.
            const keyword = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b:?\s+((?:#\d+(?:\s*(?:,|and|et)\s*)?)+)/gi
            const numbers = new Set()
            for (const m of (pr.body ?? '').matchAll(keyword)) {
              for (const n of m[1].matchAll(/#(\d+)/g)) numbers.add(Number(n[1]))
            }
            for (const number of numbers) {
              if (number === pr.number) continue
              const { owner, repo } = context.repo
              let issue
              try {
                issue = (await github.rest.issues.get({ owner, repo, issue_number: number })).data
              } catch (e) {
                core.warning(`#${number} introuvable : ${e.message}`)
                continue
              }
              if (issue.pull_request || issue.state !== 'open') continue
              await github.rest.issues.createComment({
                owner, repo, issue_number: number,
                body: `Fermé automatiquement : corrigé par #${pr.number}, fusionné dans \`develop\`.`,
              })
              await github.rest.issues.update({
                owner, repo, issue_number: number,
                state: 'closed', state_reason: 'completed',
              })
              core.info(`#${number} fermé`)
            }
